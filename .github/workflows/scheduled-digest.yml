name: Scheduled Digest

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-run-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read last run timestamp from state branch
        id: lastrun
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin state
            echo "value=$(git show origin/state:last-run.txt 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi
      - name: Determine date filtering strategy
        id: datefilter
        run: |
          if [ -n "${{ steps.lastrun.outputs.value }}" ]; then
          echo "lookback_enabled=false" >> "$GITHUB_OUTPUT"
          else
          echo "lookback_enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: mvn clean package -DskipTests
      - name: Run
        env:
          GITHUB_API_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_ISSUE_SEARCH_QUERY_CREATEDAFTER: ${{ steps.lastrun.outputs.value }}
          GITHUB_ISSUE_SEARCH_QUERY_CREATEDAFTER_LOOKBACK_ENABLED: ${{ steps.datefilter.outputs.lookback_enabled }}
        run: java -cp target/contribot-nano-*.jar io.github.khawajaabdullah.ContribotNanoApplication
      - name: Notify
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59 # v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: 'Contribot Nano Digest'
          to: ${{ vars.TO_EMAIL }}
          from: Contribot Nano <${{ vars.FROM_EMAIL }}>
          html_body: file://dist/digest.html
      - name: Push new timestamp to state branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW_TS=$(date -u +%Y-%m-%dT%H:%M:%S)
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin state
            git checkout state
          else
            git checkout --orphan state
            git rm -rf . > /dev/null 2>&1 || true
          fi
          echo "$NEW_TS" > last-run.txt
          git add last-run.txt
          git commit -m "chore: update last run timestamp to $NEW_TS"
          git push origin state